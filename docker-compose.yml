services:
  # PostgreSQL 数据库
  db:
    image: postgres:16-alpine
    container_name: squad-signup-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-squad}
      # 不提供默认密码：必须在 .env 中显式设置，防止弱密码上线
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-squad_signup}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 仅 expose 给内部网络，不对外暴露端口（更安全）
    # 如需用 1Panel 自带的 PostgreSQL，注释掉整个 db 服务即可
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-squad}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # 日志大小限制，防止日志撑满磁盘
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Next.js 应用
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: squad-signup-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # 数据库连接（指向同网络的 db 服务）
      DATABASE_URL: "postgresql://${POSTGRES_USER:-squad}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-squad_signup}?schema=public"
      DIRECT_URL: "postgresql://${POSTGRES_USER:-squad}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-squad_signup}?schema=public"
      # NextAuth 密钥（必须修改）
      AUTH_SECRET: "${AUTH_SECRET:?请在 .env 中设置 AUTH_SECRET}"
      # 战队名称前缀（首次启动写入数据库，默认空 = 无前缀）
      # 初始管理员由 deploy.sh 在终端创建（deploy.sh 首次部署时询问账户/密码）
      TEAM_PREFIX: "${TEAM_PREFIX:-}"
      # 站点 URL（部署后改成实际域名，如 https://signup.example.com）
      NEXTAUTH_URL: "${NEXTAUTH_URL:-http://localhost:3000}"
      # 信任 Host（用 IP 访问必须开启；用 HTTPS 域名访问可设为 false）
      AUTH_TRUST_HOST: "${AUTH_TRUST_HOST:-true}"
      # 信任反向代理的 X-Forwarded-For（用于限流；直接暴露时建议 false）
      TRUST_PROXY: "${TRUST_PROXY:-true}"
      # 上传文件持久目录（独立卷，重建容器不丢图）
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    ports:
      # 对外端口可在 .env 中用 PORT 指定（默认 3000）；1Panel 反向代理指向此端口
      - "${PORT:-3000}:3000"
    # 健康检查：应用崩溃但进程未退出时也能自动重启
    # 用 wget 跟随重定向，登录页 302 也算存活
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    # 日志大小限制，防止日志撑满磁盘
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  uploads:
